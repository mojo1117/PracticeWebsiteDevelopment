<!DOCTYPE html>

<html>
    <head>
        <title> Java Practice</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="This is a practice on java">
        <link rel="stylesheet" href="style.css">

    </head>

    <body>

        <h1 id="title"> Hello I am Java</h1>
        <button id="button"> Click Me  Please</button>
        


        <h2> Age Checker Java Prac</h2>
        <input type="number" id="ageValue" placeholder="Enter your age">
        <button id="ageButton"> Check Age</button>
        <p id="result"></p>



        <h2> Login page </h2>
        <input type="text" id="username" placeholder="Enter your username">
        <input type="password" id="password" placeholder="Enter password">

        <button id="loginButton"> Login </button>
        <p id="loginResult"></p>


        <div class="container">

            <h2> Calculator</h2>
            <input type="number" id="num1" placeholder="Enter the first number">
            <input type="number" id="num2" placeholder="Enter the second number">



            <button id="add"> Add</button>
            <button id="subtract"> Subtract </button>
            <button id="multiply"> Multiply </button>
            <button id="divide"> Divide </button>

            <p class="resultbox"> The result is <span id="resultBoxx"></span></p>

        </div>



















        <script src="script.js"></script>
    </body>



</html>
