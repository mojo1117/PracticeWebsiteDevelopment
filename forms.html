!<DOCTYPE html>

    <html>

        <head>
            <title> My Form Practice</title>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta name="description" content="This is a practice of Forms">
        </head>

        <body>
            <form action="submit.php" method="post" enctype="multipart/form-data">
>               <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Spongebob" minlength="6" required><br> 
                <label for="password">Password:</label> 
                <input type="password" id="password" name="password" placeholder="Type a password" required><br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Ponkan@gmail.com" required> <br>

                <label for="phone">Phone:</label>
                <input type="phone" id="phone" name="phone" placeholder="123-456-7890" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"> <br>

                <label for="bday">Birthday:</label>
                <input type="date" id="bday" name="bday" required> <br>

                <label for="quantity">Quantity:</label>
                <input type="number" id="quantity" name="quantity" min="1" max="10" required> <br>

                <label for="title">Title</label> 
                
                <label for="mr." >Mr.</label>
                <input type="radio" id="mr." name="title" value="mr.">
                <label for="mrs." >Mrs.</label>
                <input type="radio" id="mrs." name="title" value="mrs.">
                <label for="ms." >Ms.</label>
                <input type="radio" id="ms." name="title" value="ms."> <br>


                <label for="payments">Payment Method:</label>

                <select id="payments" name="payments" required>

                    <option value="credit">Credit Card</option>
                    <option value="debit">Debit Card</option>
                    <option value="paypal">PayPal</option>

                </select><br>

                <label for="subscribe">Subscribe to ponkan</label>
                <input type="checkbox" id="subscribe" name="subscribe" value="no"> <br>


                <label for="comments">Comments:</label>
                <textarea id="comments" name="comments" rows="4" cols="50" placeholder="Type ur comments for ponkan" required></textarea>
                <label for="file">Upload a file:</label>
                <input type="file" id="file" name="file" accept=".jpg, .jpeg, .png, .pdf"> <br>
                <label for="color">Choose a color:</label>
                <input type="color" id="color" name="color" value="#ff0000"> <br>
                <label for="range">Choose a range:</label>
                <input type="range" id="range" name="range" min="0" max="100" value="50"> <br>
                <label for="url">Website URL:</label>
                <input type="url" id="url" name="url" placeholder="https://www.ponkan.com" required> <br>
                <label for="search">Search:</label>
                <input type="search" id="search" name="search" placeholder="Search ponkan" required> <br>

                <input type="reset" value="Reset">
                <input type="submit" value="Submit">
            </form>
        </body>

    </html>
</DOCTYPE>
